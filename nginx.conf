worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Logging — write to stdout/stderr so Railway log tail captures everything.
  access_log /dev/stdout;

  sendfile        on;
  keepalive_timeout  65;
  client_max_body_size 100m;     # LibreChat allows ~50MB uploads; double it for headroom

  # Gzip text responses (HTML, CSS, JS) so the injected <link> + the tc-skin.css
  # transit cheaply. Skip for the upstream JS bundles (already minified+chunked
  # by Vite — let LibreChat's response cache handle those).
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
  gzip_min_length 1024;

  # Upstream = LibreChat over Railway's private network.
  # The hostname `librechat.railway.internal` resolves only inside the project's
  # private net; this proxy + LibreChat must live in the same Railway project.
  # Port 8080 because Railway injects PORT=8080 at runtime (confirmed by
  # LibreChat startup log "Server listening on all interfaces at port 8080").
  # Do NOT use 3080 — that's the LOCAL docker-compose port, not Railway's.
  upstream librechat_upstream {
    server librechat.railway.internal:8080;
    keepalive 32;
  }

  # Cache the head-injection snippet in shared memory so sub_filter doesn't
  # re-read it from disk on every request.
  map $uri $skin_link {
    default '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Source+Serif+4:opsz,wght@8..60,200..900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tc-skin.css">';
  }

  server {
    listen 8080 default_server;
    server_name _;

    # Serve our own assets (the CSS) directly — never proxy these.
    location = /tc-skin.css {
      root /usr/share/nginx/html;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=300";  # 5min — easy iteration
      types { text/css css; }
    }

    # Health check — Railway can hit this without bothering LibreChat.
    location = /tc-health {
      access_log off;
      return 200 "tc-skin ok\n";
      add_header Content-Type text/plain;
    }

    # Everything else: proxy to LibreChat.
    location / {
      proxy_pass         http://librechat_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;

      # WebSocket support — LibreChat uses WS for streaming responses.
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";

      # Long timeouts for streaming responses + long browser-MCP runs.
      proxy_read_timeout  600s;
      proxy_send_timeout  600s;

      # CSS injection. Only operates on HTML responses (sub_filter_types).
      # `sub_filter_once on` = replace only the first match (which is what we
      # want — only one <head> per document).
      sub_filter '</head>' '${skin_link}</head>';
      sub_filter_once on;
      sub_filter_types text/html;

      # Disable gzip from upstream so sub_filter can read the body. (Upstream
      # LibreChat node server doesn't gzip by default, but be explicit.)
      proxy_set_header Accept-Encoding "";
    }
  }
}
